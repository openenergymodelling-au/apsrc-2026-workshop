# Event details and running order.
#
# Text fields accept markdown (e.g. *italics*, [links](https://...)).
# Talks are NOT listed here: a session with `talks: <folder>` pulls in every
# file in talks/<folder>/, sorted by each file's `order:` field.

# Draft notice: a banner on the web pages and in the PDFs, plus a "DRAFT"
# watermark on PDF pages. Delete this line once the program is final.
draft-notice: "**Draft program.** Times, talks and speakers may still change."

event:
  kicker: "2026 Asia-Pacific Solar Research Conference"
  title: "Open-Source Energy System Modelling Workshop"
  # Short description under the title.
  byline: "An interactive workshop combining presentations, demonstrations, tutorials and open discussion on topics relevant to the open-source energy modelling community."
  # Page footer and PDF title (defaults to the title if left out)
  footer: "APSRC Open-Source Energy System Modelling Workshop"
  date: "Monday 30 November 2026"
  time: "11:00 am for an 11:30 am start · Finishes 4:00 pm, followed by networking"
  venue: "Room 6.02, [Marie Reay Teaching Centre](https://maps.app.goo.gl/GrTQ6SBZfmydb6HM8), Australian National University, Canberra"
  note: "In person only"
  # support: "Supported by RACE for 2030 and DCCEEW"   # optional text line under the venue
  # Sponsor logos, under the venue line with the label above them. Paths are
  # relative to this folder. SVG is best (sharp in the PDF and on the web);
  # otherwise a large PNG with a transparent background. `alt` describes the
  # logo for screen readers.
  logos-label: "Sponsored by:"
  logos:
    - file: logos/race-for-2030.png
      alt: "RACE for 2030"
    - file: logos/dcceew.svg
      alt: "Australian Government Department of Climate Change, Energy, the Environment and Water"

# kind: "break" gives a row lighter styling (arrival, lunch, networking).
sessions:
  - time: "11:00 – 11:30 am"
    title: "Arrival, tea & coffee"
    description: "Informal catch-up and networking before the official start."
    kind: break

  - time: "11:30 – 11:45 am"
    title: "Welcome & introduction"
    description: >-
      Opening remarks from RACE for 2030, then an overview of the day from the
      organisers, housekeeping, and an introduction to the all-day activities.

  - time: "11:45 am – 12:15 pm"
    title: "‘Short-circuit’ talks, part 1"
    description: "Five-minute ‘lightning talks’ on open-source projects, tools and datasets."
    talks: lightning-session-1

  - time: "12:15 – 12:45 pm"
    title: "Open floor: demos & discussion"
    description: >-
      Part 1 presenters host tables for demos, questions and discussion.
      Explore the projects that interest you.

  - time: "12:45 – 1:30 pm"
    title: "Lunch"
    kind: break

  - time: "1:30 – 2:00 pm"
    title: "‘Short-circuit’ talks, part 2"
    description: "Five-minute ‘lightning talks’ on open-source projects, tools and datasets."
    talks: lightning-session-2

  - time: "2:00 – 2:30 pm"
    title: "Open floor: demos & discussion"
    description: >-
      Part 2 presenters host tables for demos, questions and discussion.
      Explore the projects that interest you.

  - time: "2:30 – 3:30 pm"
    title: "Panel session"
    description: >-
      Presentations and a panel on ideas, issues and practice in open-source
      energy modelling, opening up to questions and discussion from the floor.
    talks: panel-session

  - time: "3:30 – 4:00 pm"
    title: "Wrap-up & next steps"
    description: >-
      Reflections from the day's activities and a discussion of what this
      community wants to do next.

  - time: "From 4:00 pm"
    title: "Networking"
    description: "Informal drinks and conversation."
    kind: break

# Session folders in talks/, in the order their details appear in the full
# program, with the heading used for each.
talk-folders:
  - folder: lightning-session-1
    label: "‘Short-circuit’ talks, part 1"
  - folder: lightning-session-2
    label: "‘Short-circuit’ talks, part 2"
  - folder: panel-session
    label: "Panel session"
    new-page: true   # start this session on a new page in the PDF
